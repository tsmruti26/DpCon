<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPDP Admin Authentication</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 340px; box-sizing: border-box; }
    h2 { margin: 0 0 10px 0; color: #333; text-align: center; font-size: 24px; }
    .subtitle { color: #666; font-size: 13px; text-align: center; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group { margin-bottom: 20px; text-align: left; }
    label { display: block; font-weight: 600; color: #555; margin-bottom: 5px; font-size: 14px; }
    input { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
    input:focus { border-color: #1976d2; outline: none; }
    button { width: 100%; padding: 12px; background: #1976d2; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; }
    button:hover { background: #1259a7; }
    #error-msg { color: #c62828; font-size: 13px; font-weight: 600; margin-top: 15px; text-align: center; min-height: 18px; }
  </style>
</head>
<body>

<div class="login-box">
  <h2>Admin Portal</h2>
  <div class="subtitle">DPDP Infrastructure Sign In</div>

  <div class="form-group">
    <label for="username">Administrative Username</label>
    <input type="text" id="username" placeholder="Enter username">
  </div>

  <div class="form-group">
    <label for="password">Security Password</label>
    <input type="password" id="password" placeholder="Enter password">
  </div>

  <button onclick="handleLogin()">Authenticate Terminal</button>

  <div id="error-msg"></div>
</div>

<script>
function handleLogin() {
  const userField = document.getElementById("username").value.trim();
  const passField = document.getElementById("password").value.trim();
  const errorDiv = document.getElementById("error-msg");

  errorDiv.innerText = "";

  // Checking current credentials
  if (userField === "admin" && passField === "root") {
    localStorage.setItem("dpdp_admin_session", "authenticated_token");
    
    // CRITICAL FIX: Forces the browser to route to the network port location instead of a local file
    window.location.href = "http://localhost:8080/admin";
  } else {
    errorDiv.innerText = "Invalid administrative credentials.";
  }
}
</script>
</body>
</html>
