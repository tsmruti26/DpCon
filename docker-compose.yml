services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dpdp_db
      POSTGRES_USER: dpdp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpdp -d dpdp_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-service:
    build: ./ai-service
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-auto}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in your .env file}

  backend:
    build: .
    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/dpdp_db
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_USERNAME: dpdp
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      AI_SERVICE_URL: http://ai-service:8000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in your .env file}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./privacy-pocket
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres_data:
